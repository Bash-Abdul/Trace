name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel an older run when newer code is pushed to the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs permission to read repository contents.
permissions:
  contents: read

jobs:
  verify:
    name: Quality, tests, and build
    runs-on: ubuntu-latest

    # GitHub creates a fresh PostgreSQL container for every CI run.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: trace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trace -d trace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://trace:trace@localhost:5432/trace_test
      TEST_DATABASE_URL: postgresql://trace:trace@localhost:5432/trace_test
      LOG_LEVEL: error

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Reads pnpm 11.9.0 from the root packageManager field.
      - name: Install pnpm
        uses: pnpm/setup@v2

      # Reads Node 24.13.0 from .nvmrc and caches pnpm downloads.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # node-pg-migrate expects the configured env file to exist.
      # Values supplied in the job environment remain the CI values.
      - name: Prepare CI environment file
        run: cp apps/api/.env.example apps/api/.env

      # Runs formatting, linting, type checking, unit tests,
      # clean-database integration tests, and the production build.
      - name: Verify repository
        run: pnpm verify

      - name: Scan dependencies
        run: pnpm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      # Full history allows Gitleaks to detect secrets in older commits too.
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}